name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LIBCUPS3_REF: master

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ci/ci-setup.sh deps

      - name: Build CUPS 3
        run: ci/ci-setup.sh libcups "$LIBCUPS3_REF"

      - name: Start CUPS and Avahi
        run: ci/ci-setup.sh services

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check and test
        run: ci/ci-setup.sh test

      - name: Stop the fixtures
        if: always()
        run: ci/fixtures.sh stop

      - name: Collect logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-printers-logs-${{ matrix.arch }}
          path: |
            ~/.local/state/cosmic-printers-ci/*.log
            /var/log/cups/error_log
          if-no-files-found: ignore

  # The runner image already carries most of the dependencies.
  clean-machine:
    name: Build on a clean machine
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 90

    steps:
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ci/ci-setup.sh deps

      - name: Build CUPS 3
        run: ci/ci-setup.sh libcups "$LIBCUPS3_REF"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the workspace
        run: cargo build --workspace --locked
