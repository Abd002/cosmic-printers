[workspace]
members = [
    "printers-core",
    "printers-client",
    "printers-server",
    "printers-ui",
    "printers-app",
]
# Keep the heavyweight UI and standalone application out of default workspace builds.
default-members = [
    "printers-core",
    "printers-client",
    "printers-server",
]
resolver = "3"

[workspace.dependencies.zlink]
version = "0.5"
default-features = false
features = ["tokio"]

# Local testing of the shared DNS-SD context before it is pushed. Remove once the
# cups3-pr6-signatures branch carries it.
[patch."https://github.com/Abd002/cups-rs.git"]
cups_rs = { path = "../cups-rs" }
